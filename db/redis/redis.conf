# =============================================================================
# Redis Configuration - FinTech AI Agent (Conversation State Store)
# =============================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode yes
requirepass redis_secure_pass_2024

# Memory Management
# Evict least recently used keys when full (safe: sessions auto-expire anyway)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence - AOF (Append Only File) for durability
# Sync to disk every second (balance of safety vs perf)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

# Logging - Log to stdout (Docker captures it)
loglevel notice
logfile ""

# Snapshotting (RDB) - additional safety backup
save 900 1
save 300 10
save 60 10000

# Slow query log - Log queries taking > 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security - Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
