# =============================================================================
# Logstash Pipeline Configuration
# Kafka -> Parse -> Enrich -> Elasticsearch
#
# This file defines the FULL pipeline:
#   INPUT:  Consume all 5 Kafka topics
#   FILTER: Parse JSON, add metadata, normalize fields
#   OUTPUT: Write to date-partitioned Elasticsearch indices
# =============================================================================

input {
  # ---------------------------------------------------------------------------
  # Consume all Kafka topics.
  # Each message is a JSON string published by audit_service.kafka_producer
  # ---------------------------------------------------------------------------
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS:kafka:29092}"
    topics => [
      "agent-actions",
      "compliance-decisions",
      "card-events",
      "system-errors",
      "escalations"
    ]
    group_id            => "logstash-audit-consumer"
    auto_offset_reset   => "earliest"
    decorate_events     => true
    codec               => "json"
    consumer_threads    => 2
    session_timeout_ms  => 30000
    request_timeout_ms  => 40000
  }
}

filter {
  # ---------------------------------------------------------------------------
  # 1. Parse the JSON body (already decoded by kafka codec, but defensive)
  # ---------------------------------------------------------------------------
  if [message] and [message] != "" {
    json {
      source  => "message"
      target  => "parsed"
      tag_on_failure => ["_json_parse_failure"]
    }
    if "_json_parse_failure" not in [tags] {
      ruby {
        code => "
          parsed = event.get('parsed')
          if parsed.is_a?(Hash)
            parsed.each { |k, v| event.set(k, v) }
          end
          event.remove('parsed')
          event.remove('message')
        "
      }
    }
  }

  # ---------------------------------------------------------------------------
  # 2. Add pipeline metadata to every event
  #    Note: only add simple string values here — no date patterns in mutate
  # ---------------------------------------------------------------------------
  mutate {
    add_field => {
      "pipeline_version" => "1.0.0"
      "environment"      => "${ENVIRONMENT:development}"
    }
  }

  # ---------------------------------------------------------------------------
  # 3. Parse the event_timestamp from the event body into @timestamp
  #    (so Kibana time-based queries work correctly)
  # ---------------------------------------------------------------------------
  if [event_timestamp] {
    date {
      match   => ["event_timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"]
      target  => "@timestamp"
      tag_on_failure => ["_date_parse_failure"]
    }
  }

  # ---------------------------------------------------------------------------
  # 4. Topic-specific enrichments
  # ---------------------------------------------------------------------------

  if [@metadata][kafka][topic] == "compliance-decisions" {
    if [decision] == "denied" {
      mutate { add_field => { "alert_level" => "warning" } }
    } else {
      mutate { add_field => { "alert_level" => "info" } }
    }
  }

  if [@metadata][kafka][topic] == "system-errors" {
    mutate { add_field => { "alert_level" => "critical" } }
  }

  if [@metadata][kafka][topic] == "escalations" {
    mutate { add_field => { "alert_level" => "high" } }
  }

  # ---------------------------------------------------------------------------
  # 5. Remove internal Logstash fields we don't want in Elasticsearch
  # ---------------------------------------------------------------------------
  mutate {
    remove_field => ["host", "port", "@version"]
  }
}

output {
  # ---------------------------------------------------------------------------
  # Write to Elasticsearch with date-partitioned index names.
  # Index pattern: amex-audit-{topic}-YYYY.MM.dd
  # Example:       amex-audit-agent-actions-2024.07.24
  #
  # Use [@metadata][kafka][topic] directly — avoids mutate intermediate step.
  # ---------------------------------------------------------------------------
  elasticsearch {
    hosts             => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index             => "amex-audit-%{[@metadata][kafka][topic]}-%{+YYYY.MM.dd}"
    action            => "index"
    document_id       => "%{[event_id]}"
    manage_template   => true
    template_name     => "amex-audit"
    template_overwrite => false
    retry_on_conflict => 3
    pool_max          => 10
    pool_max_per_route => 5
  }

  # DEBUG: Print to stdout in development (remove in production)
  if "${ENVIRONMENT:development}" == "development" {
    stdout {
      codec => rubydebug { metadata => true }
    }
  }
}
